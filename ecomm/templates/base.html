<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Commerce Engine{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #333; color: white; padding: 1rem; display: flex; justify-content: space-between; }
        header a { color: white; text-decoration: none; margin-left: 15px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; }
        .messages { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div>
            <strong>E-Commerce V1</strong>
        </div>
        <nav>
            <!-- We will link these to your Django URLs later -->
            <a href="/">Catalog</a>
            <a href="/cart/">My Cart</a>
        </nav>
    </header>

    <div class="container">
        <!-- Display Django messages (e.g., "Not enough stock" errors) -->
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <!-- Child templates will inject their content here -->
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>

<style>
    :root { --bg: #f8fafc; --text: #0f172a; --primary: #4f46e5; --border: #e2e8f0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { opacity: 0.9; }
</style>
